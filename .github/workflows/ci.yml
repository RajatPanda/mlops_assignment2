name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  check_working_repo:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run train.py to generate savedmodel.pth
      run: |
        echo "Training model..."
        python train.py
        echo "Model training completed"
    - name: Verify model file exists
      run: |
        if [ -f savedmodel.pth ]; then
          echo "savedmodel.pth created successfully"
        else
          echo "savedmodel.pth not found"
          exit 1
        fi
    - name: Run test.py to display test accuracy
      run: |
        echo "Testing model..."
        python test.py
        echo "Model testing completed"