name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - docker_cicd

jobs:
  check_working_repo:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run train.py to generate savedmodel.pth
      run: |
        echo "Training model..."
        python train.py
        echo "Model training completed"
    - name: Verify model file exists
      run: |
        if [ -f savedmodel.pth ]; then
          echo "savedmodel.pth created successfully"
        else
          echo "savedmodel.pth not found"
          exit 1
        fi
    - name: Run test.py to display test accuracy
      run: |
        echo "Testing model..."
        python test.py
        echo "Model testing completed"

    - name: Upload model artifact
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: |
          savedmodel.pth
          test_data.pkl
        retention-days: 30
      if: always()

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      if: github.ref == 'refs/heads/docker_cicd' || github.ref == 'refs/heads/dev'

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.ref == 'refs/heads/docker_cicd' || github.ref == 'refs/heads/dev'

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/mlops-face-recognition
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          latest
      if: github.ref == 'refs/heads/docker_cicd' || github.ref == 'refs/heads/dev'

    - name: Build and push Docker image to Docker Hub
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      if: github.ref == 'refs/heads/docker_cicd' || github.ref == 'refs/heads/dev'

    - name: Image build and push summary
      run: |
        echo ""
        echo "=========================================="
        echo "Docker Image Successfully Built & Pushed!"
        echo "=========================================="
        echo "Repository: ${{ secrets.DOCKER_USERNAME }}/mlops-face-recognition"
        echo "Tags: latest, ${{ github.sha }}"
        echo ""
        echo "To pull the image, run:"
        echo "docker pull ${{ secrets.DOCKER_USERNAME }}/mlops-face-recognition:latest"
        echo "=========================================="
      if: github.ref == 'refs/heads/docker_cicd' || github.ref == 'refs/heads/dev'
