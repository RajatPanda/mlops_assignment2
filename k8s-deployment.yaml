apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-face-recognition
  labels:
    app: mlops-face-recognition
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mlops-face-recognition
  template:
    metadata:
      labels:
        app: mlops-face-recognition
    spec:
      containers:
      - name: mlops-app
        image: rajat008/mlops-face-recognition:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "app.py"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-face-recognition-service
spec:
  type: LoadBalancer
  selector:
    app: mlops-face-recognition
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
